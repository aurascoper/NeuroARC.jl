name: Julia CI & Cryptographic Audit Verification

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: julia-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.10"
          - "1.11"
          - "1.12"
        os:
          - ubuntu-latest
          - macOS-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}

      - name: Cache Julia dependencies
        uses: julia-actions/cache@v2

      - name: Run Master Package Test Suite (325 Assertions)
        run: |
          julia --project=. -e 'using Pkg; Pkg.test()'

      - name: Run Extensions, C-ABI, GLMM & Chiral Percolation Suite (67 Assertions)
        run: |
          julia --project=. test/test_turing_ext.jl

      - name: Generate Submission & Sealed Audit Ledger
        run: |
          julia --project=. generate_submission.jl

      - name: Verify Cryptographic Audit Ledger SHA-256 Chain Seal
        run: |
          julia --project=. verify_audit_seal.jl task_audit_table.parquet.jls
          rm -f submission.json task_audit_table.parquet.jls

      - name: Audit repository text cleanliness
        run: |
          python3 test/check_text_clean.py .
